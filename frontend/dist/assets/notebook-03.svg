  <title id="title">合成示例实验笔记：AQUA-008 水相观察</title>
  <desc id="desc">水相浸泡 24 小时，实测 pH 为 6.8，观察到边缘轻微发白。浸泡后 XRD 缺失，稳定性结论待补充表征。</desc>
