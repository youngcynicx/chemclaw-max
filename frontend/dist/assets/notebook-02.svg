  <title id="title">合成示例实验笔记：MOF-025 薄膜生长</title>
  <desc id="desc">计划为 80 摄氏度两小时，示例实测为 80 摄氏度 120 分钟，观察为连续浅白色薄膜。未据此推断结晶质量。</desc>
